{% if form.non_field_errors %}<ul class="errorlist nonfield">{% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
{% for field in form.hidden_fields %}{{ field }}{% endfor %}
{% for field in form.visible_fields %}<div class="field{% if field.widget_type == 'checkbox' %} checkbox-field{% endif %}">{{ field.as_field_group }}</div>{% endfor %}

# One image, two services. Both mount the same named volume, which holds the
# SQLite database and uploaded media.
x-app: &app
  build: .
  image: regional-price-deals:latest
  env_file: .env
  volumes:
    - app-data:/data
  restart: unless-stopped

services:
  web:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput &&
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60 --access-logfile -"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: python manage.py run_publisher
    # Start only after web is healthy, i.e. after migrations have run.
    depends_on:
      web:
        condition: service_healthy
    # Let an in-flight send finish on "docker compose stop".
    stop_grace_period: 30s

volumes:
  app-data:
